const place = {};
place[1] = {lat:90, lon:0, layer:'N极', center:false};
place[2] = {lat:-90, lon:0, layer:'S极', center:false};
const ring = {
  V:  HEX.filter(h=>yang(h)===5).map(h=>h[0]),
  IV: HEX.filter(h=>yang(h)===4 && !CENTER.IV.includes(h[0])).map(h=>h[0]),
  III:HEX.filter(h=>yang(h)===3 && !CENTER.III.includes(h[0])).map(h=>h[0]),
  II: HEX.filter(h=>yang(h)===2 && !CENTER.II.includes(h[0])).map(h=>h[0]),
  I:  HEX.filter(h=>yang(h)===1).map(h=>h[0])
};
function buildSlots(L){
  const lat = latOfLayer(L);
  if(L==='V'||L==='I') return [0,60,120,180,240,300].map(lon=>({lat,lon}));
  if(L==='IV'||L==='II') return Array.from({length:12},(_,i)=>({lat,lon:i*30}));
  const s=[]; for(const b of [0,60,120,180,240,300]) for(const o of [-15,0,15]) s.push({lat,lon:b+o});
  return s;
}
for(const L of ['V','IV','II','III','I']){
  const slots = buildSlots(L); const taken = new Array(slots.length).fill(false); const msgSlots=[];
  for(const n of ring[L]){
    if(MESSAGE[n]!==undefined && MESSAGE[n]!==90 && MESSAGE[n]!==270){
      const idx = slots.findIndex((s,i)=> !taken[i] && ((s.lon%360)+360)%360 === MESSAGE[n]);
      taken[idx]=true; place[n]={lat:slots[idx].lat, lon:slots[idx].lon, layer:L, center:false}; msgSlots.push(n);
    }
  }
  let si=0;
  for(const n of ring[L]){
    if(msgSlots.includes(n)) continue;
    while(si<slots.length && taken[si]) si++;
    taken[si]=true; place[n]={lat:slots[si].lat, lon:slots[si].lon, layer:L, center:false}; si++;
  }
}

}

// ---------- 精油卡（替代卦图标签；占位→加载真实卡图） ----------
const CARD_TEX={};
function placeholderCard(n, name, color, w, h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  x.fillStyle='rgba(13,17,23,0.9)';
  const r=Math.min(w,h)*0.10;
  x.beginPath(); x.moveTo(r,0); x.arcTo(w,0,w,h,r); x.arcTo(w,h,0,h,r); x.arcTo(0,h,0,0,r); x.arcTo(0,0,w,0,r); x.closePath(); x.fill();
  x.strokeStyle=color; x.lineWidth=Math.max(2,w*0.02); x.stroke();
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle';
  x.font=`bold ${Math.round(h*0.12)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  x.fillText(n+'', w/2, h*0.32);
  x.font=`bold ${Math.round(h*0.15)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  x.fillStyle=color;
  x.fillText(name, w/2, h*0.60);
  x.fillStyle='#8b949e'; x.font=`bold ${Math.round(h*0.06)}px sans-serif`;
  x.fillText('精油卡载入中…', w/2, h*0.82);
  return c;
}
const imgLoader = new THREE.TextureLoader();
window.__dbg.make=0;
let loadedCount=0;
let guaMode=false;   // 牌面模式：false=精油牌（默认） / true=卦牌
function makeCard(n, name, color, isCenter){ window.__dbg.make++;
  // 比例接近精油卡 1240x1754 → 高宽比 1.414；普通卦比球心卦大一号
  const baseW = isCenter ? 0.62 : 0.92;
  const baseH = baseW*1.414;
  const pw = 128, ph = Math.round(pw*1.414);
  const phTex = new THREE.CanvasTexture(placeholderCard(n,name,color,pw,ph));
  phTex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({map:phTex, transparent:true, depthTest:false, opacity:1});
  const sp = new THREE.Sprite(mat);
  sp.scale.set(baseW, baseH, 1);
  sp.cardBase=[baseW, baseH];
  sp.phTex=phTex;   // 加载占位（未就绪前的精油牌纹理）
  if(!CARD_TEX[n]){
    // 真图加载：失败自动重试最多 3 次，避免弱网下个别卡永远停在"卦名占位卡"
    (function loadCardImg(attempt){
      CARD_TEX[n]=imgLoader.load('cards/'+n+'.jpg', tex=>{
        tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4;
        loadedCount++;
        sp.oilTex=tex;   // 精油图缓存（供"精油牌"模式随时切回）
        const m=mat;
        if(m && !guaMode){ m.map=tex; m.needsUpdate=true; }   // 卦牌模式下不覆盖当前卦牌纹理
        const el=document.getElementById('loading');
        if(el){
          if(loadedCount<64){ el.style.display='block'; el.textContent='精油卡载入中 '+loadedCount+'/64'; }
          else { el.style.display='none'; }
        }
      }, undefined, ()=>{
        if(attempt<3){ setTimeout(()=>loadCardImg(attempt+1), 700*(attempt+1)); }
        else {
          loadedCount++;
          const el=document.getElementById('loading');
          if(el){
            el.style.display='block';
            el.textContent = loadedCount>=64
              ? '⚠ 部分精油卡网络加载失败，请刷新页面重试'
              : '精油卡载入中 '+loadedCount+'/64（个别失败，自动重试中）';
          }
        }
      });
    })(0);
  } else {
    // 重复引用同一纹理（同序号仅一次，不会走到）
  }

  if(selCard && selCard!==c) setScale(selCard,1);
  selCard=c; setScale(c,1.18);
  if(merCard && merCard!==c) setScale(merCard,1);   // 让出经络高亮，避免叠放大
  const n=c.n, o=OIL[n]||{}, full=OILPROF[n];
  const idx=HEX.findIndex(h=>h[0]===n), gua=HEX[idx]||[];
  const meta=place[n]||{};
  const mer=MERIDIAN.find(x=>x.hex===n);
  const row=(k,v)=>`<tr><td class="k">${k}</td><td>${v}</td></tr>`;
  let fields;
  if(full){ fields=row('拉丁学名','<i>'+_esc(full.lat)+'</i>')+row('植物科属',_esc(full.fam))
    +row('萃取部位',_esc(full.part))+row('主要成分',_esc(full.chem))
    +row('适用场景','<span class="ci-scene">'+_esc(full.scene)+'</span>');
  } else { fields=row('档案','<span style="color:#6e7681">该支档案暂缺</span>'); }
  const yangCount=gua[2]?TRIGRAM_YANG[gua[2]]+TRIGRAM_YANG[gua[3]]:'';
  cardInfoEl.innerHTML=`
    <button class="ci-x" title="关闭">✕</button>
    <div class="ci-top">
      <img class="ci-img" src="cards/${n}.jpg" alt=""/>
      <div style="flex:1">
        <div class="ci-gua">第${n}卦 · ${HEXNAME[n]}（${o.gua||''}）　<span style="color:#8b949e;font-weight:400;font-size:12px">阳${yangCount} · ${meta.layer||''}</span></div>
        <div class="ci-mer">${mer?mer.tz+'时 '+mer.t+' · '+mer.name+'（消息卦·随循行放大）':'非十二消息卦'}</div>
        <div class="ci-oil">${_esc(o.oil)}${full&&full.en?' <small>'+_esc(full.en)+'</small>':''}</div>
      </div>
    </div>
    <table>${fields}</table>
    <button class="ci-btn" id="ciTake">✨ 收走此卡（放大4倍后消失）</button>
    <div class="ci-note">档案取材多特瑞官方素材 · 供学习展示参考</div>`;
  cardInfoEl.style.display='block';
  cardInfoEl.querySelector('.ci-x').onclick=()=>closeCardInfo();
  document.getElementById('ciTake').onclick=()=>{ closeCardInfo(); fadeOutCard(c,false); };
  if(window.__dbg) window.__dbg.info={n};
}
function closeCardInfo(){
  cardInfoEl.style.display='none'; cardInfoEl.innerHTML='';
  if(selCard){ setScale(selCard,1); selCard=null; }
  if(activeMer>=0) applyMer(activeMer);   // 关档案后恢复时辰高亮与信息条
}
window.__dbg.openInfo=openCardInfo; window.__dbg.closeInfo=closeCardInfo; window.__dbg.applyMer=applyMer;

// ---------- 交互：单击精油卡=看档案（档案内可收走） / 双击=直接消失 / 点太极线=隐藏 ----------
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
let downXY=null; let lastClick=null; const clickTimers={};

function fadeOutCard(c, direct){
  if(c.removed) return;
  c.removed = true;
  if(clickTimers[c.n]){ clearTimeout(clickTimers[c.n]); delete clickTimers[c.n]; }
  if(c.fx){ cancelAnimationFrame(c.fx); c.fx=0; }
  const sp=c.sp, base=[c.baseW,c.baseH];
  if(window.__dbg) window.__dbg.lastFade={n:c.n, direct:!!direct};
  if(direct){
    sp.visible=false; if(c.dot) c.dot.visible=false;
    if(window.__dbg) window.__dbg.lastFade.end=0;
    return;
  }
  const D=(window.__dbg&&window.__dbg.D)||800;   // 调试可调慢以便抓帧，默认 800ms
  const t0=performance.now();
  if(window.__dbg) window.__dbg._fadeLog=[];
  function step(){
    const k=Math.min(1,(performance.now()-t0)/D);
    const park=(window.__dbg&&window.__dbg.park)||0;   // 调试：停在中间某帧便于截图
    const kk=(park&&k>park)?park:k;
    const e=1-Math.pow(1-kk,3);
    const f=1+3*e;                       // 缩放 1 → 4 倍
    sp.scale.set(base[0]*f, base[1]*f, 1);
    sp.material.opacity=1-e;
    const L=window.__dbg&&window.__dbg._fadeLog;
    if(L&&L.length<400) L.push([+(kk.toFixed(3)), +f.toFixed(3), +((1-e).toFixed(3))]);
    if(k<1 && !(park&&k>=park)){ c.fx=requestAnimationFrame(step); }
    else if(park&&k>=park){
      c.fx=0;
      if(window.__dbg){ window.__dbg.holding={n:c.n,k:+park.toFixed(3),f:+f.toFixed(3)}; window.__dbg._hold={c,step}; }
    }
    else {
      sp.visible=false; if(c.dot) c.dot.visible=false; c.fx=0;
      if(window.__dbg) window.__dbg.lastFade.end=Math.round(performance.now()-t0);
    }
  }
  window.__dbg.finishHold=function(){
    if(!window.__dbg) return;
    window.__dbg.park=0;
    const h=window.__dbg._hold; window.__dbg._hold=null;
    if(h&&h.step) h.step();
  };
  step();
}
function resetAllCards(){
  for(const c of cardRecs){
    if(c.fx){ cancelAnimationFrame(c.fx); c.fx=0; }
    if(clickTimers[c.n]){ clearTimeout(clickTimers[c.n]); delete clickTimers[c.n]; }
    c.removed=false; c.sp.visible=true; c.sp.scale.set(c.baseW,c.baseH,1); c.sp.material.opacity=1;
    if(c.dot) c.dot.visible=true;
  }
  if(window.__dbg){ window.__dbg._fadeLog=[]; window.__dbg.lastFade=null; }
  lastClick=null;
  if(cardInfoEl) cardInfoEl.style.display='none';
  if(selCard){ selCard=null; }
  if(activeMer>=0) applyMer(activeMer);   // 复原后重新挂上当前时辰高亮与信息条
}
renderer.domElement.addEventListener('pointerdown', e=>{ downXY=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!downXY) return;
  const moved = Math.hypot(e.clientX-downXY[0], e.clientY-downXY[1]); downXY=null; if(moved>5) return;
  window.__dbg.pu=(window.__dbg.pu||0)+1;
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse, camera);
  const sprites = cardRecs.map(c=>c.sp).filter(s=>s.visible);
  const hit = ray.intersectObjects(sprites, false)[0]
      || ray.intersectObjects(dots.filter(d=>d.visible), false)[0]
      || ray.intersectObjects(sunGroup.visible ? [sunLine] : [], false)[0];
  window.__dbg.pick={n:(hit&&hit.object.userData&&hit.object.userData.n!=null)?hit.object.userData.n:null,
    type:hit?hit.object.type:'none', x:Math.round(e.clientX), y:Math.round(e.clientY), t:performance.now()};
  if(!hit){
    if(cardInfoEl && cardInfoEl.style.display==='block') closeCardInfo();   // 点空白 → 关档案
    return;
  }
  const ud=hit.object.userData||{};
  if(ud.kind==='sun'){ setSunVisible(false); return; }   // 点太极线 → 消失
  const n=ud.n; if(n==null) return;
  const c=cardRecs.find(x=>x.n===n); if(!c || c.removed) return;
  const now=performance.now();
  if(lastClick && lastClick.n===n && now-lastClick.t<300){
    // 双击 → 直接消失（关掉可能开着的档案）
    if(clickTimers[n]){ clearTimeout(clickTimers[n]); delete clickTimers[n]; }
    lastClick=null; if(selCard) closeCardInfo(); fadeOutCard(c, true); return;
  }
  if(lastClick && lastClick.n!==n && clickTimers[lastClick.n]){
    clearTimeout(clickTimers[lastClick.n]); delete clickTimers[lastClick.n]; // 切到另一张卡：取消上一张待发动作
  }
  lastClick={n, t:now};
  clickTimers[n]=setTimeout(()=>{ delete clickTimers[n]; if(!c.removed) openCardInfo(c); }, 300);  // 单击 → 看档案
});
// ---------- 调试帮手（浏览器验证用，对用户无影响） ----------
window.__dbg.screenOf=function(n){
  const c=cardRecs.find(x=>x.n===n); if(!c) return null;
  const v=new THREE.Vector3(); c.sp.getWorldPosition(v); v.project(camera);
  return {n, x:Math.round((v.x*0.5+0.5)*innerWidth), y:Math.round((-v.y*0.5+0.5)*innerHeight),
    z:+v.z.toFixed(3), visible:c.sp.visible, removed:c.removed};
};
window.__dbg.front=function(k){
  return cardRecs.filter(c=>c.sp.visible&&!c.removed).map(c=>{
    const v=new THREE.Vector3(); c.sp.getWorldPosition(v); v.project(camera);
    return {n:c.n, x:(v.x*0.5+0.5)*innerWidth, y:(-v.y*0.5+0.5)*innerHeight, z:+v.z.toFixed(3)};
  }).sort((a,b)=>b.z-a.z).slice(0,k||8);
};
window.__dbg.state=function(){
  return {visible:cardRecs.filter(c=>c.sp.visible&&!c.removed).length,
    removed:cardRecs.filter(c=>c.removed).map(c=>c.n),
    flowPaused, pu:window.__dbg.pu||0};
};
const infoBox = document.getElementById('info');
document.getElementById('btnReset').addEventListener('click', resetAllCards);

// ---------- 开关 ----------
document.getElementById('t-rotate').addEventListener('change', e=> controls.autoRotate = e.target.checked);
document.getElementById('t-para').addEventListener('change', e=> paraGroup.visible = e.target.checked);
document.getElementById('t-meri').addEventListener('change', e=> meriGroup.visible = e.target.checked);
document.getElementById('t-meri-fine').addEventListener('change', e=> meriFineGroup.visible = e.target.checked);
document.getElementById('t-meri-path').addEventListener('change', e=> flowGroup.visible = e.target.checked);
document.getElementById('t-yinyang').addEventListener('change', e=> yyGroup.visible = e.target.checked);
document.getElementById('t-sun').addEventListener('change', e=> sunGroup.visible = e.target.checked);
let curPeriod = FLOW_PERIOD;   // 共用周期：循行走满一圈的秒数 = 球体转动 360° 的秒数（1:1 同步；默认 144s，每经 144/12=12s 平均）
document.getElementById('t-ball').addEventListener('change', e=>{ curPeriod = parseFloat(e.target.value) || FLOW_PERIOD; flowUniforms.uPeriod.value = curPeriod; });

// 牌面切换：精油牌 / 卦牌
document.querySelectorAll('input[name="cv"]').forEach(r=> r.addEventListener('change', e=>{ if(e.target.checked) setCardMode(e.target.value==='gua'); }));
// "说明"总开关：隐藏/显示 操作提示·层色图例·经络图例·信息条等（.aux 元素）
document.getElementById('t-aux').addEventListener('change', e=> document.body.classList.toggle('aux-off', !e.target.checked));

// 面板收起/恢复：左上控制面板、右上图层面板（点 ✕ 收起 → 角落出现 ⚙/🗂 小钮 → 点钮恢复）
function bindPanelToggle(panelId, closeId, btnId){
  const el=document.getElementById(panelId), close=document.getElementById(closeId), btn=document.getElementById(btnId);
  if(!el||!close||!btn) return;
  close.addEventListener('click', ()=>{ el.classList.add('hidden'); btn.style.display='inline-block'; });
  btn.addEventListener('click', ()=>{ el.classList.remove('hidden'); btn.style.display='none'; });
}
bindPanelToggle('ui','uiClose','btnUi');
bindPanelToggle('layers','layersClose','btnLayers');

// 十二经络图例（时辰 + 经络 + 色）；merChips 供循行联动高亮
const merChips = [];
(function(){
  const box=document.getElementById('merLegend');
  MERIDIAN.forEach((m,i)=>{
    const c='#'+MER_COLOR[i].getHexString();
    const chip=document.createElement('div'); chip.className='chip';
    chip.innerHTML=`<span class="sw" style="background:${c}"></span><b>${m.tz}</b><span>${m.t} ${m.name}</span>`;
    box.appendChild(chip); merChips.push(chip);
  });
})();

// ---------- 渲染 ----------
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
const _q=new URLSearchParams(location.search);                       // 调试/分享：?t=秒数&p=1 → 打开即停在指定时辰
let flowTime=(parseFloat(_q.get('t'))||0), flowPaused=!!(_q.get('p')==='1'||_q.get('pause')==='1'); const clock=new THREE.Clock();
let lastMer = -1;
function syncMerLegend(u){
  const m = meridianAt(u);
  if(m === lastMer) return;
  if(merChips[lastMer]) merChips[lastMer].classList.remove('on');
  if(merChips[m]) merChips[m].classList.add('on');
  lastMer = m;
  applyMer(m);   // A4：同步放大当前时辰的消息卦精油卡 + 更新信息条
}
function animate(){ window.__dbg.anim=true; requestAnimationFrame(animate); controls.update(); const dt=clock.getDelta();
  if(started && !flowPaused) flowTime += dt;               // 未点击前静止：白点停在起点(0h)对齐正对您；点击任意处/键后才开始
  const tt = (flowTime % curPeriod) / curPeriod;           // 0..1 = 白点沿路径走完一整圈
  flowUniforms.uTime.value = flowTime;                     // 循行进度推进（亮窗沿路径前行，无跳点无拖尾）
  flowUniforms.uPeriod.value = curPeriod;                  // 周期随下拉框同步（默认144s）
  { const loc=flowLoc(tt); const A=flowPts[loc.i], B=flowPts[loc.i+1];   // 白点贴在前沿
    if(A&&B) headGroup.position.copy(A).lerp(B, loc.f);
    _mc.copy(MER_COLOR[flowMer[loc.i]]).lerp(_white,0.35); headDotMat.color.copy(_mc); }
  syncMerLegend(tt);                                       // 下方十二经络图例跟着联动高亮
  // ---- 定稿模型（按用户大白话）：白点长在球上、沿路径跑；跑到球面哪里，球就把那一面转到正对我 ----
  // 循行线路(含白点/起点标记/箭头)与球体是"同一个整体"，每帧用同一转角 yaw，永不互相错位：
  //   白点在整体坐标里的方位角 α = atan2(x,z)（沿路径从起点绕一整圈回到起点）；
  //   想让白点所在的那一面正对相机，只需整体转到 yaw = 相机方位 − α。
  //   → 球体没有任何独立转速/方向，只是"追着白点把它转到正对我"；
  //     白点沿路径绕满 360° ⇔ 整体恰好追着转满 360°，循行结束时两者同时回到起点对齐。
  const camA = Math.atan2(camera.position.x, camera.position.z);            // 相机当前正对的方位
  const yaw = camA - Math.atan2(headGroup.position.x, headGroup.position.z); // 让白点所在面正对相机所需转角
  globeGroup.rotation.y = yaw;   // 球体
  flowGroup.rotation.y  = yaw;   // 循行线路 —— 与球刚性同转
  renderer.render(scene,camera); }
// 点击屏幕任意处 / 按任意键 → 才开始转动与循行（此刻起点已正对前方）
let started = false;
const startGate = document.getElementById('startGate');
function beginFlow(){ if(started) return; started = true; startGate.style.display = 'none'; }
startGate.addEventListener('pointerdown', beginFlow);
addEventListener('keydown', e=>{ if(!started){ beginFlow(); e.stopImmediatePropagation(); } });  // 首个键只负责"开始"，不触发暂停
animate();
addEventListener('keydown', e=>{ if(!started) return; if(e.code==='Space'){ e.preventDefault(); flowPaused=!flowPaused; document.getElementById('pauseBadge').style.display = flowPaused?'block':'none'; } });
</script>
